<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1220" />
    <title>存到照片 · Tang Tang</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b1220;
        color: #e8eef6;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Noto Sans SC", sans-serif;
      }
      .save-wrap {
        max-width: 480px;
        margin: 0 auto;
        padding: 16px 16px 40px;
        box-sizing: border-box;
      }
      .save-title {
        margin: 8px 0 4px;
        font-size: 1.2rem;
        font-weight: 700;
      }
      .save-sub {
        margin: 0 0 14px;
        color: #9fb0c3;
        font-size: 0.9rem;
        line-height: 1.55;
      }
      .save-video-box {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
        border: 2px dashed rgba(20, 184, 166, 0.55);
      }
      .save-video {
        width: 100%;
        max-height: 62vh;
        display: block;
        background: #000;
      }
      .longpress-tip {
        pointer-events: none;
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font-size: 0.88rem;
        font-weight: 600;
        line-height: 1.45;
        text-align: center;
      }
      .save-actions {
        display: grid;
        gap: 10px;
        margin-top: 16px;
      }
      .save-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: #14b8a6;
        color: #041016;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
      .save-btn:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      .save-btn.ghost {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.22);
        color: #e8eef6;
        text-decoration: none;
      }
      .save-steps {
        margin: 16px 0 0;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        color: #c5d3e2;
        font-size: 0.86rem;
        line-height: 1.55;
      }
      .save-steps strong {
        color: #fff;
      }
      .wechat-banner,
      .fail-banner {
        display: none;
        margin: 0 0 14px;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 0.9rem;
        line-height: 1.5;
        font-weight: 600;
      }
      .wechat-banner {
        background: #be185d;
        color: #fff;
      }
      .fail-banner {
        background: #b45309;
        color: #fff;
      }
      .wechat-banner.show,
      .fail-banner.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="save-wrap">
      <div class="wechat-banner" id="wechat-banner">
        当前是微信内置浏览器，无法存相册。请点右上角 ··· →「在浏览器中打开」。
      </div>
      <div class="fail-banner" id="fail-banner">
        系统分享不可用。请用手指按住上方视频约 1 秒，在菜单里选「存储到照片」。
      </div>
      <h1 class="save-title" id="title">成片</h1>
      <p class="save-sub" id="sub">
        先点绿色按钮；若没弹出「存储到照片」，请长按上方视频保存。
      </p>
      <div class="save-video-box">
        <video
          id="player"
          class="save-video"
          controls
          playsinline
          webkit-playsinline
          preload="auto"
        ></video>
        <div class="longpress-tip" id="longpress-tip">
          也可长按此视频 →「存储到照片」
        </div>
      </div>
      <div class="save-actions">
        <button type="button" class="save-btn" id="btn-save">
          存到照片 / 相册
        </button>
        <button type="button" class="save-btn ghost" id="btn-hint">
          绿色按钮没反应？看这里
        </button>
        <a class="save-btn ghost" id="btn-back" href="/gallery.html">返回成片</a>
      </div>
      <div class="save-steps" id="steps">
        <strong>iPhone 正确存法：</strong><br />
        1）点绿色「存到照片」→ 系统菜单选「存储到照片」<br />
        2）若没有该选项：用手指按住上方视频约 1 秒 →「存储到照片」<br />
        3）不要点进全黑播放器——那里没有存相册入口
      </div>
    </div>
    <script src="/download.js"></script>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const src = params.get("src") || "";
        const name = params.get("name") || "tangtang-video.mp4";
        const title = params.get("title") || "成片";
        const player = document.getElementById("player");
        const btnSave = document.getElementById("btn-save");
        const btnHint = document.getElementById("btn-hint");
        const btnBack = document.getElementById("btn-back");
        const wechatBanner = document.getElementById("wechat-banner");
        const failBanner = document.getElementById("fail-banner");
        const sub = document.getElementById("sub");

        document.getElementById("title").textContent = title;

        function abs(url) {
          try {
            return new URL(url, document.baseURI || location.href).href;
          } catch {
            return url;
          }
        }

        if (!src) {
          sub.textContent = "缺少视频地址";
          btnSave.disabled = true;
          return;
        }

        const videoUrl = abs(src);
        player.src = videoUrl;

        try {
          const base = document.querySelector("base")?.href;
          if (base) btnBack.href = new URL("gallery.html", base).href;
        } catch {
          /* ignore */
        }

        const ua = navigator.userAgent || "";
        const inWeChat = /MicroMessenger|QQ\//i.test(ua);
        if (inWeChat) wechatBanner.classList.add("show");

        function showLongPressHelp() {
          failBanner.classList.add("show");
          sub.textContent =
            "请用手指按住上方视频约 1 秒，在弹出菜单选「存储到照片」。";
          document.getElementById("longpress-tip").textContent =
            "按住这里 1 秒 → 存储到照片";
          try {
            player.scrollIntoView({ behavior: "smooth", block: "center" });
          } catch {
            /* ignore */
          }
        }

        btnHint.addEventListener("click", showLongPressHelp);

        btnSave.addEventListener("click", async () => {
          if (inWeChat) {
            alert(
              "微信里存不了相册。\n请点右上角 ··· →「在浏览器中打开」，再点绿色按钮。"
            );
            return;
          }
          if (!window.TangDownload?.saveMediaToAlbum) {
            showLongPressHelp();
            return;
          }
          const prev = btnSave.textContent;
          btnSave.disabled = true;
          btnSave.textContent = "正在调出系统菜单…";
          try {
            const result = await window.TangDownload.saveMediaToAlbum(
              videoUrl,
              name
            );
            if (result === "shared" || result === "downloaded") {
              sub.textContent = "已调出保存流程。若已选「存储到照片」，可返回成片。";
              failBanner.classList.remove("show");
            } else if (result === "cancelled") {
              sub.textContent = "已取消。也可长按上方视频保存。";
            }
          } catch (err) {
            showLongPressHelp();
          } finally {
            btnSave.disabled = false;
            btnSave.textContent = prev;
          }
        });

        player.addEventListener(
          "loadeddata",
          () => {
            if (!failBanner.classList.contains("show")) {
              sub.textContent =
                "视频已就绪：点绿色按钮，或长按视频 →「存储到照片」。";
            }
          },
          { once: true }
        );
      })();
    </script>
  </body>
</html>
