# Tang Tang workbench — Fly.io（新加坡，偏快）
app = 'tangtang-workbench'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  NODE_ENV = 'production'
  USE_OEMER = '0'
  PORT = '8787'
